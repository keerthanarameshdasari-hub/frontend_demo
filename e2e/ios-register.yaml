# iOS part 1: create an account in the app and reach the KYC screen.
# The iOS simulator has no files for the document picker to show, so scripts/e2e/ios.sh
# then submits the KYC document for this user straight to the API (the upload itself is
# covered on Android and by the contract test) and runs ios-wallet.yaml.
appId: com.demo.wallet.dev
name: iOS register
---
- launchApp:
    clearState: true
    clearKeychain: true
# Wait for a real element: Android doesn't expose plain container views to UI tests.
- extendedWaitUntil:
    visible:
      id: login.emailInput
    timeout: 60000
- assertVisible:
    id: app.envBadge
    text: DEV
- takeScreenshot: 01-login
- tapOn:
    id: login.mode.register
- tapOn:
    id: login.fullNameInput
- inputText: E2E Tester
- tapOn:
    id: login.emailInput
- inputText: ${EMAIL}
# Dismiss the keyboard before the password field: moving straight from one field into a
# secure one is where the simulator drops typed characters.
- tapOn:
    id: app.screenTitle
- tapOn:
    id: login.passwordInput
- inputText: correct-horse-battery
# iOS keyboards have no standard dismiss action (the number pad has no return key).
- tapOn:
    id: app.screenTitle
# Enabled only once every field is valid, so this catches typing that didn't arrive.
- assertVisible:
    id: login.submitButton
    enabled: true
- tapOn:
    id: login.submitButton
- extendedWaitUntil:
    visible:
      id: kyc.documentNumberInput
    timeout: 30000
- assertVisible:
    id: kyc.pickFileButton
- takeScreenshot: 02-kyc
