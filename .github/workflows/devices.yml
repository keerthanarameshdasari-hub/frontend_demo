name: Devices

# Builds the dev app for Android and iOS and runs it on GitHub's machines: an Android
# emulator on Linux and an iOS simulator on macOS, each against backend_demo at the commit
# pinned in api/openapi.lock.json. Maestro drives the app through its testIDs and saves
# screenshots, a screen recording and a report as downloadable artifacts.
#
# Run it from the Actions tab ("Run workflow"), or let it run on a pull request that
# changes the app. docs/ci.md explains what it covers and how to read the results.

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, test, main]
    paths:
      - "src/**"
      - "index.js"
      - "android/**"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - ".env.dev"
      - "api/**"
      - "e2e/**"
      - "scripts/e2e/**"
      - ".github/workflows/devices.yml"

# Deny everything by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  MAESTRO_VERSION: "2.11.0"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  android:
    name: Android emulator (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read # read the repository code
    steps:
      - name: Free disk space
        # The React Native build plus an emulator image don't fit in the runner's default
        # free space. These toolchains aren't used here (the Android SDK is kept).
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned backend commit
        id: pin
        run: |
          set -euo pipefail
          commit=$(jq -r '.commit' api/openapi.lock.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::lock has no full commit SHA"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out backend_demo at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keerthanarameshdasari-hub/backend_demo
          ref: ${{ steps.pin.outputs.commit }}
          path: backend_demo
          persist-credentials: false

      - name: Start backend_demo (docker compose)
        working-directory: backend_demo
        run: |
          docker compose up --build --detach --wait --wait-timeout 300 api
          curl -fsS http://localhost:3000/meta/min-app-version

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the dev release APK (JS bundled in, x86_64 only)
        working-directory: android
        run: ./gradlew assembleDevRelease -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace

      - name: Install Maestro (checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/e2e/install-maestro.sh "$MAESTRO_VERSION"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the journey on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e/android.sh android/app/build/outputs/apk/dev/release/app-dev-release.apk

      - name: Backend logs (on failure)
        if: failure()
        working-directory: backend_demo
        run: docker compose logs --no-color --tail 200

      - name: Upload screenshots, recording and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-results
          path: e2e-results/android
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS simulator (dev)
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read # read the repository code
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned backend commit
        id: pin
        run: |
          set -euo pipefail
          commit=$(jq -r '.commit' api/openapi.lock.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::lock has no full commit SHA"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out backend_demo at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keerthanarameshdasari-hub/backend_demo
          ref: ${{ steps.pin.outputs.commit }}
          path: backend_demo
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Start backend_demo (Postgres, S3 stand-in, API; macOS runners have no Docker)
        run: scripts/e2e/start-backend-macos.sh backend_demo

      - name: Set up Ruby (for CocoaPods)
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"

      - name: Set up JDK 17 (for Maestro)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "17"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          bundle install
          cd ios && bundle exec pod install

      - name: Build the Dev scheme for the simulator (Release-Dev, JS bundled in)
        # Signed ad hoc ("Sign to Run Locally", no Apple account needed): an unsigned app
        # has no keychain entitlement, so react-native-keychain couldn't store the token.
        run: |
          set -o pipefail
          xcodebuild -workspace ios/WalletDemo.xcworkspace -scheme Dev -configuration Release-Dev \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build ONLY_ACTIVE_ARCH=YES ARCHS=arm64 CODE_SIGN_IDENTITY=- \
            build | tail -200

      - name: Install Maestro (checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/e2e/install-maestro.sh "$MAESTRO_VERSION"

      - name: Run the journey on an iOS simulator
        run: scripts/e2e/ios.sh ios/build/Build/Products/Release-Dev-iphonesimulator/WalletDemo.app

      - name: Upload screenshots, recording, report and backend logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results
          path: e2e-results/ios
          if-no-files-found: warn
          retention-days: 14
