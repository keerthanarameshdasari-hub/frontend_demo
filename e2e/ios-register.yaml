# iOS part 1: create an account in the app and reach the KYC screen.
# The iOS simulator has no files for the document picker to show, so scripts/e2e/ios.sh
# then submits the KYC document for this user straight to the API (the upload itself is
# covered on Android and by the contract test) and runs ios-wallet.yaml.
appId: com.demo.wallet.dev
name: iOS register
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 60000
- assertVisible:
    id: app.envBadge
    text: DEV
- takeScreenshot: 01-login
- tapOn:
    id: login.mode.register
- tapOn:
    id: login.fullNameInput
- inputText: E2E Tester
- tapOn:
    id: login.emailInput
- inputText: ${EMAIL}
- tapOn:
    id: login.passwordInput
- inputText: correct-horse-battery
- hideKeyboard
- tapOn:
    id: login.submitButton
- extendedWaitUntil:
    visible:
      id: kyc.documentNumberInput
    timeout: 30000
- assertVisible:
    id: kyc.pickFileButton
- takeScreenshot: 02-kyc
